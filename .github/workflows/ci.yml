name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: Audit dependencies
        if: matrix.python-version == '3.13'
        run: pip-audit --requirement requirements.txt

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        env:
          SECRET_KEY: validation-only
          POSTGRES_PASSWORD: validation-only
        run: docker compose config --quiet
      - name: Verify an existing volume is selected without creating a replacement
        run: sh tests/upgrade/verify_compose_volume.sh
      - name: Build image
        run: docker build --tag brewweb:ci .
      - name: Verify legacy database upgrade preserves data
        run: sh tests/upgrade/verify_container_upgrade.sh brewweb:ci

  postgres:
    name: PostgreSQL restore and compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_USER: brewtest
          POSTGRES_PASSWORD: runner-test-only
          POSTGRES_DB: brewtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewtest -d brewtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies and PostgreSQL client
        run: |
          python -m pip install --requirement requirements-dev.txt
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-15
      - name: Verify legacy upgrades and atomic restores in isolated databases
        env:
          BREWWEB_TEST_POSTGRES: postgresql+psycopg2://brewtest:runner-test-only@localhost:5432/brewtest
        run: python -m pytest tests/test_postgres.py -v
      - name: Install runner-only browser test dependencies
        run: |
          python -m pip install --requirement tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify site functionality with remote browser dependencies blocked
        env:
          SECRET_KEY: browser-runner-test-only
          DATABASE_URL: postgresql+psycopg2://brewtest:runner-test-only@localhost:5432/brewtest
        run: python tests/browser_smoke.py
