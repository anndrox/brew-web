name: Publish container

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Verify immutable release tag matches the source version
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLISHED_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify anonymous access to the immutable published image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/brewweb-anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$PUBLISHED_IMAGE"
      - name: Verify published image startup and data-preserving upgrades
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/brewweb-anonymous-docker
        run: |
          sh tests/upgrade/verify_container_upgrade.sh "$PUBLISHED_IMAGE"
          sh tests/upgrade/verify_container_upgrade.sh "$PUBLISHED_IMAGE" \
            ghcr.io/anndrox/brew-web@sha256:6eaa72ba9897450023fe8394a88203d962a49611111e49c64348d208907cbe51
      - name: Verify the published runtime security versions
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/brewweb-anonymous-docker
        run: |
          docker run --rm --interactive --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint python "$PUBLISHED_IMAGE" \
            -B - < tests/security/runtime_versions.py
      - name: Verify the exact published runtime remains PHP-free
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/brewweb-anonymous-docker
        run: sh tests/security/verify_no_php.sh "$PUBLISHED_IMAGE"
