{% extends "base.html" %}

{% block content %}
<h2 class="mt-4">Login</h2>

{% if oidc_enabled %}
<p>Sign in with Authentik SSO to access Brew Web.</p>
<p><a class="btn btn-primary" href="{{ url_for('auth_bp.oidc_login') }}">Continue with Authentik</a></p>
{% endif %}

{% if local_login_enabled %}
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

  <div class="mb-3">
    <label for="username" class="form-label">Username</label>
    <input
      type="text"
      class="form-control"
      id="username"
      name="username"
      required
    >
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      name="password"
      required
    >
  </div>

  <button type="submit" class="btn btn-primary">Log In</button>
</form>
{% endif %}
{% endblock %}
